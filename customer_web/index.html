<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Madhuloka Dining - Order</title>
    <meta name="description" content="Scan, Browse & Order from your table at Madhuloka Dining">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo"><img src="MD.png" alt="Logo"></div>
            <h1 class="loading-title">Madhuloka</h1>
            <p class="loading-subtitle">Dining</p>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading menu...</p>
        </div>
    </div>

    <!-- Error Screen -->
    <div id="error-screen" class="error-screen hidden">
        <div class="error-content">
            <div class="error-icon">⚠️</div>
            <h2>Oops!</h2>
            <p id="error-message">Something went wrong. Please scan the QR code again.</p>
            <button onclick="location.reload()" class="btn-primary">Try Again</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <span class="header-logo"><img src="MD.png" alt="Logo"></span>
                    <div>
                        <h1 class="header-title">Madhuloka Dining</h1>
                        <p class="header-subtitle" id="table-name">Table</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="pulse-dot"></div>
                    <span class="live-text">LIVE</span>
                </div>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search menu items..." autocomplete="off">
                <button id="search-clear" class="search-clear hidden" onclick="clearSearch()">✕</button>
            </div>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="category-tabs">
            <!-- Filled by JS -->
        </div>

        <!-- Menu Items -->
        <main class="menu-container" id="menu-container">
            <!-- Filled by JS -->
        </main>

        <!-- Cart and Success screens removed for View-Only mode -->
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=1.2"></script>
</body>
</html>
